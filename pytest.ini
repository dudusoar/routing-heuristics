[tool:pytest]
# pytest configuration for VRP Toolkit

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes
    
# Markers for categorizing tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests that should be skipped in CI
    requires_data: Tests that require external data files
    requires_osmnx: Tests that require OSMnx (optional dependency)
    tutorial: Tutorial validation tests
    
# Test coverage (if coverage.py is installed)
# --cov=vrp_toolkit
# --cov-report=term-missing
# --cov-report=html
    
# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
    
# Timeout for slow tests (in seconds)
timeout = 300
timeout_method = thread